name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Scan working tree for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 dir /repo --redact
      - run: npm install --global pnpm@10.34.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Reject high and critical Valkey vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          image-ref: valkey/valkey:8-alpine
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
      - run: pnpm audit --prod
      - run: pnpm osv:scan
      - name: Build web for isolated browser tests
        run: pnpm --filter @jobpilot/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Verify encrypted recovery with production tools
        run: |
          docker build -f apps/worker/Dockerfile -t jobpilot-worker:phase12 .
          pnpm verify:recovery
