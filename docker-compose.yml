services:
  postgres:
    image: jobpilot-db:phase12
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
  valkey:
    image: valkey/valkey:8-alpine
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
    command:
      [
        'sh',
        '-c',
        'exec valkey-server --appendonly yes --requirepass "$$VALKEY_PASSWORD"',
      ]
    ports: ['127.0.0.1:${VALKEY_PORT:-6379}:6379']
    volumes: ['valkey_data:/data']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'valkey-cli --no-auth-warning -a "$VALKEY_PASSWORD" ping | grep PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      [
        '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025',
        '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025',
      ]
volumes:
  postgres_data:
  valkey_data:
